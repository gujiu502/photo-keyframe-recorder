name: Signed APK release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore private signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          printf '%s' "$KEYSTORE" | base64 --decode > .signing/release.jks
      - name: Build and verify
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          chmod +x gradlew
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo 'Configure GOOGLE_WEB_CLIENT_ID and Android OAuth signing fingerprints before publishing this release.'; exit 1; }
          ./gradlew :data:recorder:testDebugUnitTest :data:cloud:testDebugUnitTest :app:lintDirectRelease :app:assembleDirectRelease :app:bundlePlayRelease
          mkdir -p dist
          cp app/build/outputs/apk/direct/release/app-direct-release.apk "dist/PhotoKeyframeRecorder-${GITHUB_REF_NAME}.apk"
          python3 tools/make_update_manifest.py "dist/PhotoKeyframeRecorder-${GITHUB_REF_NAME}.apk" app/build/outputs/apk/direct/release/output-metadata.json "$GITHUB_REF_NAME"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Photo Keyframe Recorder $GITHUB_REF_NAME" --prerelease --notes-file docs/RELEASE.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
